name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: License check
        run: |
          if [ -f "LICENSE" ]; then
            echo "[OK] LICENSE present"
          else
            echo "[NO] LICENSE missing" && exit 1
          fi

      - name: Run tests (go test ./...)
        run: |
          # 真实运行 Go SDK 全部单元测试，任何失败都会使 job 失败。
          go test ./...
